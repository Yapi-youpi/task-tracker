name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  verify:
    name: Verify backend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Validate server can start
        run: node --check index.js
        working-directory: server

  deploy:
    name: Trigger backend deploy
    runs-on: ubuntu-latest
    needs: verify
    env:
      BACKEND_DEPLOY_HOOK_URL: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger deploy via hook
        if: ${{ env.BACKEND_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "$BACKEND_DEPLOY_HOOK_URL"

      - name: Show setup instructions
        if: ${{ env.BACKEND_DEPLOY_HOOK_URL == '' }}
        run: |
          echo "BACKEND_DEPLOY_HOOK_URL is not configured."
          echo "Set repository secret BACKEND_DEPLOY_HOOK_URL with your platform deploy webhook."
